[project]
name = "uvcheck"
version = "0.1.0"
description = "A small project wrapper for running checks through uv."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
dependencies = []

[project.scripts]
uvcheck = "uvcheck:main"

[dependency-groups]
dev = ["ruff"]

[tool.setuptools]
py-modules = ["uvcheck"]

[tool.uv]
package = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
extend-select = [
    "ANN",  # flake8-annotations: catches missing type annotations
    "B",    # flake8-bugbear: catches likely bugs; selected for correctness
    "LOG",  # flake8-logging: catches problematic logging usage; selected as low-noise correctness checks
    "RET",  # flake8-return: catches inconsistent or unnecessary return patterns
    "SIM",  # flake8-simplify: flags needless control-flow complexity
    "I",    # isort: sorts and groups imports consistently
    "W",    # pycodestyle warnings: catches whitespace issues
    "RUF",  # Ruff-specific checks: useful correctness and maintainability checks
]
